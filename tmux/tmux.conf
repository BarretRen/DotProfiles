# ============================================================
#  Tmux 配置文件
#  生效方式：prefix + r 重新加载
# ============================================================

# -------------------- 基础设置 --------------------
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g assume-paste-time 0
set -g escape-time 0
set -g default-terminal "tmux-256color"          # 支持真彩色
set -ga terminal-overrides ",*256col*:RGB"       # 启用 RGB 颜色
# set -ga terminal-overrides ",*:XT"              # 备选终端特性（注释）
# set -ga terminal-overrides ",*:Ms=\\E]52;%p1%s;%p2%s\\007"  # 剪贴板支持（注释）

set -g default-shell '/bin/bash'
set -g history-limit 10000                       # 滚动历史行数（可调高至90000）
set -g renumber-windows on                       # 关闭窗口时自动重编号
set -g set-titles on                             # 设置窗口标题
setw -g automatic-rename off                     # 禁止自动重命名窗口
set -g allow-rename off

# -------------------- 键绑定 --------------------
# 面板拆分
bind v split-window -h
bind h split-window -v

# 重新加载配置
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

# 方向键选择面板（vi 风格）
bind i selectp -U   # 上
bind k selectp -D   # 下
bind j selectp -L   # 左
bind l selectp -R   # 右

# 清屏 + 清除历史（前缀 + M-l）
bind M-l send-keys -R \; clear-history

# 待用：弹出窗口（注释）
# bind M-f popup -w 60% -h 70% "tmux attach -t pop || tmux new -s pop"

# -------------------- 鼠标与模式 --------------------
setw -g mode-keys vi
set -g mouse on                                 # 默认启用鼠标
bind m set -g mouse on                          # 手动开启
bind n set -g mouse off                         # 手动关闭
# set -g mouse-resize-pane on                   # 已弃用，tmux ≥2.1 使用 mouse

# -------------------- 窗口 / 面板管理 --------------------
set -g base-index 1                             # 窗口编号从1开始
setw -g pane-base-index 1                       # 面板编号从1开始
set -g aggressive-resize on                     # 自动调整面板大小

# 活动监视
setw -g monitor-activity on
set -g visual-activity on
setw -g visual-activity off                     # 关闭窗口内视觉提示（避免干扰）
set -g bell-action any
setw -g window-status-bell-style bg=white
setw -g window-status-bell-style fg=red

# 显示时间
set -g display-panes-time 800
set -g display-time 1000

# 环境变量传递
set-option -g update-environment "SSH_AUTH_SOCK SSH_CONNECTION DISPLAY"

# -------------------- 状态栏主题（亮色默认） --------------------
# 如需切换暗色，将下方 %if 1 改为 %if 0，并取消暗色部分的注释

%if 1
    # ---------- 亮色主题 ----------
    set -g mode-style "fg=#569fba,bg=#233f5e"
    set -g message-style "fg=#569fba,bg=#233f5e"
    set -g message-command-style "fg=#569fba,bg=#233f5e"
    set -g pane-border-style "fg=#233f5e"
    set -g pane-active-border-style "fg=#569fba"
    set -g status "on"
    set -g status-justify "centre"
    set -g status-style "fg=#569fba,bg=#d4f2e7"
    set -g status-left-length "100"
    set -g status-right-length "100"
    set -g status-left-style NONE
    set -g status-right-style NONE

    set -g status-left "#[fg=#1d344f,bg=#569fba,bold] #h #[fg=#1d344f,bg=#569fba,bold] #S #[fg=#569fba,bg=#d4f2e7,nobold,nounderscore,noitalics]"
    set -g status-right "#[fg=#569fba,bg=#d4f2e7,nobold,nounderscore,noitalics]#[fg=#1d344f,bg=#569fba] %Y-%m-%d  %H:%M "

    setw -g window-status-activity-style "underscore,fg=#2e537d,bg=#d4f2e7"
    setw -g window-status-separator ""
    setw -g window-status-style "NONE,fg=#2e537d,bg=#d4f2e7"
    setw -g window-status-format "#[fg=#d4f2e7,bg=#d4f2e7,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#d4f2e7,bg=#d4f2e7,nobold,nounderscore,noitalics]"
    setw -g window-status-current-format "#[fg=#d4f2e7,bg=#233f5e,nobold,nounderscore,noitalics]#[fg=#569fba,bg=#233f5e,bold] #I  #W #F #[fg=#233f5e,bg=#d4f2e7,nobold,nounderscore,noitalics]"
